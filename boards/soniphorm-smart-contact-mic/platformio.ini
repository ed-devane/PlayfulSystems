; Soniphorm Smart Contact Mic (ESP32-S3-WROOM-1-N16R8)
;
; Upload the test sketch (from this folder):
;   pio run -e 00_test_modes -t upload
; See BOARD.md before changing anything in [env].

[platformio]
src_dir = examples
default_envs = 00_test_modes

[env]
; Pinned versions. The official "espressif32" platform is an older Arduino
; core and will not build this code.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
platform_packages = platformio/tool-esptoolpy @ ~2.40900.0
framework = arduino
board = esp32-s3-devkitc-1

; 16 MB flash, 8 MB OPI PSRAM
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv

; USB_MODE=1 uses the chip's built-in USB serial, so uploads work without
; pressing buttons (after the first one).
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
monitor_echo = yes
upload_speed = 921600

; All the tests in one sketch, switched by typing a number.
[env:00_test_modes]
build_src_filter = -<*> +<00_test_modes/>

[env:01_board_check]
build_src_filter = -<*> +<01_board_check/>

[env:02_tone_out]
build_src_filter = -<*> +<02_tone_out/>

[env:03_piezo_meter]
build_src_filter = -<*> +<03_piezo_meter/>

[env:04_passthrough]
build_src_filter = -<*> +<04_passthrough/>

[env:05_record_play]
build_src_filter = -<*> +<05_record_play/>

[env:06_header_pots]
build_src_filter = -<*> +<06_header_pots/>
