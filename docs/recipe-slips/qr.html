<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipe Slips QR code</title>
  <style>
    /* Always black on white, so cameras can read it and it prints well. */
    body { font-family: system-ui, sans-serif; background: #fff; color: #111; text-align: center; padding: 16px; }
    #code svg { width: min(80vw, 70vh, 26rem); height: auto; }
    a { word-break: break-all; }
  </style>
</head>
<body>
  <h1>Scan with your phone</h1>
  <div id="code">Loading…</div>
  <p><a id="link"></a></p>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script type="module">
    import { APP_URL } from './js/config.js';

    const link = document.getElementById('link');
    link.href = link.textContent = APP_URL;
    const box = document.getElementById('code');
    if (typeof qrcode === 'undefined') {
      box.textContent = 'The QR code library did not load. Check the internet and reload.';
    } else {
      const qr = qrcode(0, 'M');
      qr.addData(APP_URL);
      qr.make();
      box.innerHTML = qr.createSvgTag({ cellSize: 8, margin: 32, scalable: true });
    }
  </script>
</body>
</html>
